[project]
name = "psephos"
version = "0.1.0"
description = "Statistical anomaly detection for precinct-level election results. Flags patterns that warrant investigation; it does not detect fraud."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Xocas Alvarez-Jorge" }]
keywords = ["elections", "election-forensics", "psephology", "anomaly-detection", "statistics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14.0"]

[project.urls]
Homepage = "https://github.com/Xocas12/psephos"
Issues = "https://github.com/Xocas12/psephos/issues"

[project.scripts]
psephos = "psephos.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyarrow>=14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psephos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY", "PD", "RUF"]
ignore = ["E501", "PD901", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "PD"]
